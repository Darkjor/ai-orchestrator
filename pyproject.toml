[project]
name = "ai-orchestrator"
version = "0.1.0"
description = "A global, tech-agnostic AI Orchestrator CLI framework"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0"
]

[project.scripts]
ai-orch = "aiorch.main:app"

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"
