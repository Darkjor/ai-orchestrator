[project]
name = "ai-orchestrator"
version = "0.3.0"
description = "A global, tech-agnostic AI Orchestrator CLI framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Darkjor", email = "fabookcaballero@gmail.com"}
]
keywords = ["ai", "orchestration", "cli", "agents", "context", "project-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "typer>=0.26.8",
    "rich>=15.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]
observability = ["supabase>=2.31.0"]

[project.scripts]
ai-orch = "aiorch.main:app"

[tool.setuptools.package-data]
aiorch = ["templates/*.md", "templates/*.json"]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"
